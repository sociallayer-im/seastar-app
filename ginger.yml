service: seastar-app
image: home-registry.sola.day/sola/seastar-app

runner: nomad
egress: traefik

servers:
  web:
    hosts: [homepod.sola.day]
    primary: true

# 自建 registry（yatch）。2026-08-02 起不再经 ghcr。
registry:
  server: home-registry.sola.day
  username: sola
  password: YATCH_TOKEN

proxy:
  # auth.sola.day is served by this app now that the sign-in screens live here —
  # middleware rewrites that host's '/' to /signin, so sign-in URLs already in
  # circulation keep working.
  #
  # Traefik routing is undefined while two services claim the same Host rule, so
  # the cutover has an order:
  #   1. cd soon && ginger deploy            # SIWE allowlist must accept app.sola.day
  #   2. cd seastar-auth && ginger remove    # releases auth.sola.day (and its memory)
  #   3. cd seastar-app && ginger deploy     # claims it here
  # Step 3 builds before it boots, so auth.sola.day is unrouted for roughly the
  # length of one deploy. Only stale cached HTML still points there — freshly
  # served pages link to /signin on their own origin — and a retry fixes it. To
  # close even that gap, deploy step 3 once with auth.sola.day removed from this
  # list, then re-add it and `ginger deploy --skip-push` (seconds, no rebuild).
  #
  # Rollback: `ginger rollback <prev>` here (the previous image has
  # NEXT_PUBLIC_SIGN_IN_URL=https://auth.sola.day baked in) then
  # `cd seastar-auth && ginger deploy --skip-push`. seastar-auth's config is left
  # pointing at auth.sola.day precisely so that second step needs no edit.
  # sola.day is the canonical host as of 2026-08-15. app.sola.day and
  # www.sola.day are kept routed here only so middleware can 308 them to it —
  # removing them from this list would give visitors a bare Traefik 404 instead
  # of a redirect, which is worse than the old URL working.
  #
  # infinitacity/edgeesmeralda are group subdomains: middleware reads the first
  # label as a group handle and renders that group's home page in place (see
  # getGroupSubdomain -> x-event-home -> app/(normal)/page.tsx). There are 391
  # rows in soon's `domains` table that could work the same way, but each needs
  # its own DNS record and an entry here — a wildcard would need a wildcard
  # Traefik rule and a DNS-01 ACME challenge, since HTTP-01 cannot answer for
  # *.sola.day. Only these two were asked for.
  #
  # ORDER: repoint DNS BEFORE deploying a new host into this list.
  #
  # Traefik asks Let's Encrypt for the certificate the moment the router
  # appears — not on the first request, which is what an earlier version of
  # this comment claimed and which cost an outage on 2026-08-15. Deploying
  # first means the HTTP-01 challenge is answered by whatever the old DNS
  # still points at (a 404 from Vercel, in that case), the whole SAN bundle
  # fails, and every host in this list that had no cert yet serves a TLS
  # error. app.sola.day 308ing to a certless sola.day made that user-visible.
  #
  # Worse, Traefik does NOT retry on its own: it only re-runs ACME when the
  # router config actually changes, so re-deploying the identical list is a
  # no-op. Recovery is to deploy once with the failing hosts REMOVED, then
  # again with them re-added — two `ginger deploy --skip-push` runs, ~20s
  # each — so they register as new domains. Restarting Traefik would also
  # work but it is shared with ~12 other services.
  hosts: [sola.day, www.sola.day, app.sola.day, auth.sola.day, infinitacity.sola.day, edgeesmeralda.sola.day]
  app_port: 3000
  ssl: true
  health_check_path: /api/health

ssh:
  user: ubuntu                # homepod 上 ubuntu 在 docker 组，且能直接调 Nomad

builder:
  arch: amd64
  # Built on wamo.city over SSH rather than on homepod: the deploy host is the
  # one serving production and has ~8 GB free, while wamo has 19 GB and 405 GB
  # of disk. Nothing runs locally — buildx drives the remote daemon through
  # this SSH endpoint, so no local Docker daemon is needed.
  remote: ssh://ubuntu@wamo.city
  # ginger's default is mode=min, which exports only the FINAL stage to the
  # registry build cache. This Dockerfile is three-stage and the expensive step
  # — `pnpm install` — lives in the `build` stage, so min never cached it
  # anywhere but the builder's own local store, one `docker buildx prune`
  # away from a cold rebuild. max exports every stage. Verified from ginger's
  # actual invocation: --cache-to type=registry,mode=min,ref=<image>:buildcache.
  cache: max

# ginger's default task memory is 512 MiB, and `next start` for this app sits
# around 350 MiB steady but spikes past 512 while server-rendering the heavier
# routes — which cgroup-OOM-killed the task (Nomad: exit 139 "OOM Killed") in a
# restart loop, so requests intermittently got Traefik's bare 404 with no router
# to send them to. Raised with headroom over the observed peak rather than to
# just above it.
#
# This host has ~3.8 GiB of real RAM and Nomad is configured as if it had 8 GiB,
# so it will schedule more than physically exists — raising any limit here needs
# the actual free memory checked first (`free -h` on sg.sola.day), not just
# Nomad's accounting.
# 900 MB was measured against `next start` and was never re-measured for
# vinext. The 2026-08-19 deploy died on it: the container was OOM-killed at
# ~916 MB RSS while warming up on live traffic, Nomad auto-reverted, and the
# site stayed on the old image — no outage, but no deploy either.
#
# Measured on this host against the actual image: idle 78 MB, and a
# 400-request burst at 50 concurrency only reaches ~130 MB. So the working set
# is small and this ceiling exists for the warm-up spike under real traffic,
# which is what 900 MB could not absorb.
#
# Node sizes its heap from the cgroup limit, not host RAM (verified: 900 MB ->
# 498 MB heap, 1536 MB -> 864 MB, 2048 MB -> 1120 MB), so it already collects
# rather than overrunning the ceiling; the OOM was total RSS — heap plus
# everything outside it — not the heap alone. Do NOT add
# --max-old-space-size here: at this cgroup size it would only raise the heap
# cap above what Node picks and squeeze the non-heap space that actually ran
# out.
resources:
  memory: 1536

env:
  NODE_ENV: production

# NEXT_PUBLIC_* are baked in at build time (from .env.production in the image
# context); these are also injected at runtime for any server-side reads.
secrets:
  load: [.env.production]
  inject:
    - NEXT_PUBLIC_API_URL
    - NEXT_PUBLIC_APP_TITLE
    # Read by middleware, which Next inlines at build like any other
    # NEXT_PUBLIC_ var — injected here only for symmetry with the rest of the
    # list. Both are non-empty in .env.production; ginger aborts on an inject
    # key with no value, which is why ginger.cn.yml must NOT list them (CN
    # leaves both unset so no host normalisation happens there).
    - NEXT_PUBLIC_CANONICAL_HOST
    - NEXT_PUBLIC_CANONICAL_REDIRECT_HOSTS
    - NEXT_PUBLIC_AUTH_FIELD
    - NEXT_PUBLIC_CLIENT_MODE
    - NEXT_PUBLIC_ENABLE_GOOGLE_MAP
    - NEXT_PUBLIC_GOOGLE_MAP_API_KEY
    # NEXT_PUBLIC_SIGN_IN_URL is deliberately NOT injected: its value is now the
    # empty string (meaning "use the in-app sign-in screens"), and ginger treats
    # an inject key with no value as unset and aborts the deploy. Nothing reads
    # it server-side either — NEXT_PUBLIC_* are inlined at `next build`, and its
    # only readers are client components. Rolling back to an external auth origin
    # means editing .env.production and rebuilding, not flipping a runtime var.
    - NEXT_PUBLIC_THIRD_PARTY_LOGIN
    - NEXT_PUBLIC_GOOGLE_CLIENT_ID
    # Server-side only — read by app/api/google-signin to call
    # /auth/trusted_signin. NOT a NEXT_PUBLIC_ var, and must not become one:
    # it mints a session for any email.
    - NEXT_TOKEN

retain_containers: 5
