service: seastar-app
image: registry.juluo.xyz/seastar-app

runner: nomad
egress: traefik
traefik_provider: nomad   # juluo Traefik uses the Nomad provider
force_pull: true          # always re-pull on deploy (robust to same-tag rebuilds)

servers:
  web:
    hosts: [juluo.xyz]
    primary: true

registry:
  server: registry.juluo.xyz
  username: username
  password: YATCH_TOKEN          # resolved from .env.cn.production

proxy:
  # One host on CN. Sign-in lives in this app at /signin
  # (NEXT_PUBLIC_SIGN_IN_URL is empty in .env.cn.production, which selects the
  # in-app screens), so www.juluo.xyz is its own login provider and there is no
  # second origin to hop to. auth.juluo.xyz is retired outright rather than
  # re-pointed here the way auth.sola.day was: SG had sign-in links in
  # circulation to keep working, CN has none.
  hosts: [www.juluo.xyz]
  app_port: 3000
  ssl: true
  health_check_path: /api/health

ssh:
  user: root

builder:
  arch: amd64
  # Moved from wamo.city to homepod (2026-08-21), same as ginger.yml — a
  # dedicated 3 GB-capped buildx builder now isolates this from production.
  # No more push_registry: mirror-registry.sola.day is retired, and there's
  # no other registry to route this build's own CN-baked image through —
  # push straight to registry.juluo.xyz (registry: above).
  remote: ssh://ubuntu@homepod
  # ginger's default is mode=min, which exports only the FINAL stage to
  # <image>:buildcache. This Dockerfile is three-stage and the expensive step —
  # `pnpm install`, node_modules — is in the `build` stage, so min
  # never wrote it to the registry: it survived only in the builder's local
  # buildkit cache, and would be lost the moment that container is
  # recreated or pruned. max exports every stage.
  cache: max

env:
  NODE_ENV: production

# Same 900 as SG, and for the same measured reason: `next start` idles near
# 350 MiB but spikes past ginger's 512 MiB default while server-rendering the
# heavier routes. On SG that produced a cgroup-OOM restart loop — three
# allocations dead in 19 minutes — during which Traefik had no backend and
# answered every request with a bare Go "404 page not found". CN runs the same
# build, so it gets the same headroom.
resources:
  memory: 900

secrets:
  load: [.env.cn.production]
  inject:
    - NEXT_PUBLIC_API_URL
    - NEXT_PUBLIC_APP_TITLE
    # Absolute origin for Open Graph URLs. Needed here because the code default
    # is https://sola.day (the international site): without this, CN's share
    # cards would link visitors out of CN entirely. Verified empirically that
    # keys in this list reach `next build` — CN's client bundle contains
    # api.juluo.xyz and no api.sola.day, and .env.cn.production is not a
    # filename Next auto-loads, so the inject list is the only path in.
    #
    # NEXT_PUBLIC_CANONICAL_HOST is deliberately absent: it switches on host
    # normalisation, and CN's www.juluo.xyz must not redirect anywhere.
    - NEXT_PUBLIC_CANONICAL_ORIGIN
    - NEXT_PUBLIC_AUTH_FIELD
    - NEXT_PUBLIC_CLIENT_MODE
    - NEXT_PUBLIC_ENABLE_GOOGLE_MAP
    - NEXT_PUBLIC_GOOGLE_MAP_API_KEY
    # NEXT_PUBLIC_SIGN_IN_URL / NEXT_PUBLIC_GOOGLE_CLIENT_ID are both empty on
    # CN (in-app sign-in; Google sign-in off), and ginger rejects an inject key
    # with no value. See ginger.yml — neither is read server-side.
    - NEXT_PUBLIC_THIRD_PARTY_LOGIN
    # WeChat 服务号 sign-in, CN only. The APP_ID/APP_SECRET pair is deliberately
    # not NEXT_PUBLIC_: the secret redeems authorization codes, and route
    # handlers read both server-side (src/app/api/wechat/).
    - NEXT_PUBLIC_WECHAT_LOGIN
    - WECHAT_APP_ID
    - WECHAT_APP_SECRET
    # Server-side only — see ginger.yml.
    - NEXT_TOKEN

# NEXT_PUBLIC_* are inlined at `next build` from .env.production in the build
# context. Swap in the CN values for the build, then restore the SG file.
#
# YATCH_TOKEN is filtered out of the copy: it is a registry credential ginger
# reads from .env.cn.production, and the Dockerfile copies .env.production into
# the runtime image — so an unfiltered copy would ship the registry token
# inside the deployed app. Nothing in the app reads it.
#
# NOTE: if `build` fails, restore manually: mv .env.production.sgbak .env.production
pipelines:
  deploy:
    - hook: { run: '[ -f .env.production.sgbak ] || cp -f .env.production .env.production.sgbak; grep -v "^YATCH_TOKEN" .env.cn.production > .env.production', local: true }
    - build
    - push
    - hook: { run: 'mv -f .env.production.sgbak .env.production 2>/dev/null || rm -f .env.production', local: true }
    - lock: acquire
    - boot-proxy
    - boot-app: { rolling: true }
    - prune
    - lock: release

retain_containers: 5
